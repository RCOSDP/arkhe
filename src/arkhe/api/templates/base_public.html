<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22%236d5bd0%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20transform%3D%22translate%2812%2012%29%20scale%28.72%29%20translate%28-12%20-12%29%22%3E%3Ccircle%20cx%3D%2210.3%22%20cy%3D%2213.4%22%20r%3D%224.6%22%2F%3E%3Cpath%20d%3D%22M15.1%207.4c-.9%203.2-.9%206.4.9%209.2%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>{% block title %}arkhe{% endblock %}</title>
<style>
/* 解決結果の人間向け表示（`?info`）。
 * **対象に到達できなくても答えられる**ことが要点なので、読み物として成立させる。 */
:root { color-scheme: light dark;
  --bg:#fbfbfc; --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa; --line:#e8e8ea;
  --accent:#6d5bd0;
  --mono: ui-monospace,"SF Mono",Menlo,monospace;
  --sans: system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
@media (prefers-color-scheme: dark) { :root {
  --bg:#0d0d0f; --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#6b6b74; --line:#27272a; --accent:#a394f5; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
       font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased; }
.doc { max-width:720px; margin:0 auto; padding:72px 24px 96px; }
.kicker { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
          font-weight:650; margin:0 0 8px; }
h1 { font-size:26px; font-weight:650; letter-spacing:-.02em; margin:0 0 10px; line-height:1.35; }
h2 { font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
     font-weight:650; margin:40px 0 12px; }
.ark { color:var(--ink-2); margin:0 0 32px; font-size:14px; }
.mono { font-family:var(--mono); }
dl { display:grid; grid-template-columns:150px 1fr; gap:0; margin:0; }
dt { color:var(--ink-3); font-size:13px; padding:9px 0; border-top:1px solid var(--line); }
dd { margin:0; padding:9px 0; border-top:1px solid var(--line); }
a { color:var(--accent); }
.dim { color:var(--ink-3); }
.note { border-left:2px solid var(--accent); padding:2px 0 2px 14px; color:var(--ink-2);
        font-size:14px; margin:0 0 28px; }
.fine { font-size:13.5px; color:var(--ink-2); margin-top:18px; }
b { font-weight:650; color:var(--ink); }
</style>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
