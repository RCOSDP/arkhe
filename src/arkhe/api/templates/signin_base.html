{# ログイン系の外枠。**ログイン画面と、そこへ戻す画面で同じ体裁にする。**
   別々に持つと、片方だけ古びて「別のサービスに飛ばされた」ように見える。 #}
<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t('login.title') }}{% endblock %} — arkhe</title>
<style>
:root{color-scheme:light dark;
--bg:#f7f7f8;--panel:#fff;--line:#e8e8ea;--line2:#f1f1f3;--ink:#18181b;--ink2:#52525b;
--ink3:#a1a1aa;--accent:#6d5bd0;--accent-ink:#fff;--stop:#b91c1c;--stop-soft:#fdf0ef;
--r:10px;--r-sm:7px;--shadow:0 8px 24px -6px rgb(16 16 20/.12),0 2px 6px rgb(16 16 20/.05);
--sans:"Inter",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0f;--panel:#161618;--line:#27272a;
--line2:#1f1f22;--ink:#f4f4f5;--ink2:#a1a1aa;--ink3:#6b6b74;--accent:#a394f5;
--accent-ink:#17151f;--stop:#f87171;--stop-soft:#2a1616;--shadow:0 10px 30px -8px rgb(0 0 0/.6)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;
-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.wrap{width:calc(100% - 40px);max-width:380px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px}
.brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
color:var(--accent-ink);font-weight:700;font-size:14px;letter-spacing:-.03em}
.brand .t{font-weight:650;font-size:16px;letter-spacing:-.015em}
.brand .t small{display:block;font-weight:400;font-size:11px;color:var(--ink3);letter-spacing:.04em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
padding:26px;box-shadow:var(--shadow)}
h1{font-size:16px;font-weight:650;margin:0 0 20px;letter-spacing:-.015em}
label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
input{font:inherit;font-size:14px;padding:9px 12px;width:100%;border:1px solid var(--line);
border-radius:var(--r-sm);background:var(--panel);color:var(--ink);
transition:border-color .12s,box-shadow .12s}
input:focus{outline:none;border-color:var(--accent);
box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.field{margin-bottom:16px}
button{width:100%;font:inherit;font-size:14px;font-weight:600;padding:10px;border:0;
border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);cursor:pointer;
transition:filter .12s}
button:hover{filter:brightness(1.07)}
.err{background:var(--stop-soft);color:var(--stop);border-radius:var(--r-sm);
padding:10px 13px;margin-bottom:18px;font-size:13px}
.msg{color:var(--ink2);margin:0 0 20px;font-size:13.5px}
.again{display:block;text-align:center;font:inherit;font-size:14px;font-weight:600;
padding:11px;border:0;border-radius:var(--r-sm);background:var(--accent);
color:var(--accent-ink);text-decoration:none;transition:filter .12s}
.again:hover{filter:brightness(1.07)}
.foot{display:flex;justify-content:center;gap:2px;margin-top:18px;padding:2px;
background:var(--line2);border-radius:var(--r-sm);width:fit-content;margin-inline:auto}
.foot a{font-size:12px;padding:3px 11px;border-radius:5px;color:var(--ink3);
text-decoration:none;transition:.12s}
.foot a.on{background:var(--panel);color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="mark">αρ</span>
    <span class="t">arkhe<small>{{ t('app.subtitle') }}</small></span>
  </div>
  <div class="card">
{% block card %}{% endblock %}  </div>
  <div class="foot">
    {% for code, label in langs.items() %}
      <a href="?lang={{ code }}{% if next_url %}&next={{ next_url }}{% endif %}"
         class="{% if code == lang %}on{% endif %}" lang="{{ code }}">{{ label }}</a>
    {% endfor %}
  </div>
</div>
</body>
</html>
