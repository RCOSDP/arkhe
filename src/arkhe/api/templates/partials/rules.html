{# 名前空間／組織の決まり。**同じ形で見せる**——片方だけ違う並びだと、
   狭めているのか別のことをしているのかが読めない。
   `outer` があれば、上位で既に絞られている分を示す。 #}
<div class="field">
  <label>{{ t('op.auth') }}</label>
  <div class="checks">
    {% for mech in mechanisms %}
    <label class="check">
      <input type="checkbox" name="allowed_auth" value="{{ mech }}"
             {% if mech in current_auth.split() %}checked{% endif %}
             {% if outer and outer.allowed_auth and mech not in outer.allowed_auth.split() %}disabled{% endif %}>
      <span><b>{{ t('au.mech.' ~ mech) }}</b> <code>{{ mech }}</code></span>
    </label>
    {% endfor %}
  </div>
  <p class="hint">{{ t('op.auth_hint')|safe }}</p>
</div>

<div class="field">
  <label class="check">
    <input type="checkbox" name="self_register" value="1"
           {% if current_self %}checked{% endif %}
           {% if outer and not outer.may_self_register %}disabled{% endif %}>
    <span><b>{{ t('op.self') }}</b></span>
  </label>
  <p class="hint">{{ t('op.self_hint') }}</p>
</div>

<div class="field">
  <label>{{ t('op.max') }}</label>
  <div class="checks">
    {% for sc in scopes %}
    <label class="check">
      <input type="checkbox" name="max_scopes" value="{{ sc }}"
             {% if sc in current_max.split() %}checked{% endif %}
             {% if outer and outer.max_scopes and sc not in outer.max_scopes.split() %}disabled{% endif %}>
      <span><b>{{ t('sc.' ~ sc) }}</b> <code>{{ sc }}</code></span>
    </label>
    {% endfor %}
  </div>
  <p class="hint">{{ t('op.max_hint')|safe }}</p>
</div>
