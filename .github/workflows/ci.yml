name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # **マイグレーションは PostgreSQL で検証する。** SQLite は PostgreSQL が
      # 弾くスキーマを通すので、そこだけの確認では移行のバグが漏れる。
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: arkhe, POSTGRES_PASSWORD: arkhe, POSTGRES_DB: arkhe}
        options: >-
          --health-cmd "pg_isready -U arkhe" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      # **lock どおりに入れる**（`--frozen`）。lock と pyproject がずれていたら
      # ここで落ちる——ずれたまま緑になるほうが困る。
      - run: uv sync --frozen --extra app --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - name: migrations on postgresql
        env:
          ARKHE_DATABASE_URL: postgresql+psycopg://arkhe:arkhe@localhost/arkhe
          ARKHE_AUTH: apikey
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
