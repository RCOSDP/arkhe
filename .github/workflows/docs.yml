name: docs

on:
  push:
    branches: [main]
    # CHANGELOG は docs/project/changelog*.md から取り込んでいる（`--8<--`）。
    # ここに入れておかないと、変更履歴を書いても公開が追随しない。
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "CHANGELOG.ja.md"
      - "mkdocs.yml"
      - "src/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: ["docs/**", "CHANGELOG.md", "CHANGELOG.ja.md", "mkdocs.yml"]
  # 手で起動できるようにしておく（課金の停止などで自動実行が落ちたときに要る）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      # **lock どおりに入れる**（`--frozen`）。lock と pyproject がずれていたら
      # ここで落ちる——ずれたまま緑になるほうが困る。
      - run: uv sync --frozen --extra app --extra docs
      # API 仕様は実装から起こす。**手で書いた仕様がずれることを構造的に防ぐ。**
      - run: uv run python scripts/export_openapi.py
      - run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}

  deploy:
    # PR ではビルドの検証だけ行い、公開はしない。
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
