name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: arkhe, POSTGRES_PASSWORD: arkhe, POSTGRES_DB: arkhe}
        options: >-
          --health-cmd "pg_isready -U arkhe" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[app,dev]' build

      # **タグと pyproject の版が一致していること。** 版は pyproject だけで決まるので、
      # ここがずれると「v0.0.2 と名乗る 0.0.1」が世に出る。
      - name: tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$pkg" || { echo "tag=$tag but pyproject=$pkg"; exit 1; }

      - run: ruff check src tests
      - run: pytest -q

      # 台帳は作り直せない。**マイグレーションは往復させてから出す。**
      - name: migrations round-trip on postgresql
        env:
          ARKHE_DATABASE_URL: postgresql+psycopg://arkhe:arkhe@localhost/arkhe
          ARKHE_AUTH: apikey
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # 0.x のあいだはプレリリースとして出す（版の意味を誤解させない）。
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
