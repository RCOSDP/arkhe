# 依存の更新を受け取る。**lock があるだけでは古びていくのを止められない。**
#
# 固定は「今日と同じものが明日も入る」ための仕組みであって、「新しいものを
# 見なくてよい」という意味ではない。放っておくと、直っている脆弱性を抱えたまま
# 動き続けることになる——**まとめて上げるほうが、1 つずつより難しい。**
#
# 毎週。1 つずつ PR が来ると読む気が失せるので、まとめて 1 本にする。
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    # **lock だけ動かす。宣言は触らせない。**
    #
    # 既定の Dependabot は、更新を「効かせる」ために `pyproject.toml` の下限を
    # 入れた版まで引き上げてくる。だがそれは「古い版では動かない」と言うのと
    # 同じで、確かめずにそう言うことになる——arkhe をライブラリとして使う側は、
    # 理由の無い下限のぶんだけ他と共存しにくくなる。
    #
    # 「どの範囲なら動くか」は宣言が、「今どれで動かしているか」は lock が持つ。
    # 更新で動くのは後者だけでよい。
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
    commit-message: {prefix: "chore(deps)"}

  # ワークフローの action も同じ理由で古びる。
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions:
        patterns: ["*"]
    commit-message: {prefix: "chore(ci)"}
