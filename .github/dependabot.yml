# Receive dependency updates. A lock file alone does not stop things ageing.
#
# Pinning exists so that tomorrow installs what today installed; it does not mean
# nothing new has to be looked at. Left alone, the service keeps running with
# vulnerabilities that have already been fixed, and catching up all at once is harder
# than keeping up.
#
# Weekly, grouped into one pull request: a stream of separate ones stops being read.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    # Only the lock moves; the declaration is left alone.
    #
    # By default Dependabot raises the lower bounds in pyproject.toml to whatever it
    # installed, to make the update "take effect". That is the same as saying the older
    # version does not work, without having checked, and anyone using arkhe as a library
    # then has a harder time fitting it alongside other packages.
    #
    # The declaration says which versions work; the lock says which are in use. An
    # update only has to move the second.
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
    commit-message: {prefix: "chore(deps)"}

# Workflow actions are not watched, because there are no workflows. Checking and
# publishing are the three scripts in scripts/, run locally (see AGENTS.md).
