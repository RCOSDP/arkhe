[project]
name = "arkhe"
version = "0.11.0"
description = "ARK identifier infrastructure — minter and resolver as separate services"
requires-python = ">=3.12"
license = "MIT"
# There is a layer that imports with no dependencies at all (arkspec and
# domain.resolution), so the application's dependencies are optional. Anyone who only
# wants to check the specification installs nothing.
dependencies = []

[project.optional-dependencies]
app = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",      # hashing API keys
  "pyjwt[crypto]>=2.9",     # our own tokens, and verifying OIDC
  "httpx>=0.27",            # fetching the JWKS
  "typer>=0.15",            # the operator commands
  "jinja2>=3.1",            # the admin templates
  "python-multipart>=0.0.12",  # the admin forms
]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov", "ruff", "httpx>=0.27"]
docs = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2", "mike>=2.1"]

[project.scripts]
arkhe = "arkhe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# The end-to-end suite is deselected by default. It starts PostgreSQL in docker and
# brings up two uvicorn processes, which takes about 25 seconds; mixed in with the fast
# net, nobody would run either. check.sh calls it as its own step (uv run pytest -m e2e).
addopts = "-m 'not e2e'"
markers = ["e2e: the end-to-end suite, built in the production shape and driven over HTTP (needs docker)"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
