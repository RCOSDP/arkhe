[project]
name = "jc2-ark"
version = "0.1.0"
description = "JC2 の ARK 識別子基盤（採番・解決・RA 機能）"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
app = ["Django>=5.2,<6.0", "django-oauth-toolkit>=3.4,<4.0",
       "djangorestframework>=3.18", "drf-spectacular>=0.30", "psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-django", "pytest-cov", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jc2ark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "jc2ark.entrypoints.settings"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
